<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Hours Tracker</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <button id="theme-toggle" class="theme-toggle">☀️ Light Mode</button>

    <div class="container">
        <div class="quote-container" id="quote-container">
            </div>
        
        <div class="stats-grid">
            <div class="stat-card">
                <h3>Total Hours</h3>
                <p id="total-hours">0</p>
            </div>
            <div class="stat-card">
                <h3>Current Streak</h3>
                <p id="streak-days">0 <span>days</span></p>
            </div>
            <div class="stat-card">
                <h3>Daily Average</h3>
                <p id="avg-hours">0 <span>hrs</span></p>
            </div>
        </div>

        <div class="card graph-card">
            <canvas id="studyChart"></canvas>
        </div>

        <div class="card form-card">
            <form id="tracker-form">
                <div class="input-row">
                    <input type="date" id="date" required>
                    <input type="number" id="hours" min="0.1" step="0.1" placeholder="Hours (e.g., 2.5)" required>
                    <button type="submit">Log</button>
                </div>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
