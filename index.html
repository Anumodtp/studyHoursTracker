<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Hours Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>📚 Study Hours Tracker</h1>
        
        <div class="card">
            <h2>Log Your Session</h2>
            <form id="tracker-form">
                <div class="form-group">
                    <label for="subject">Subject / Task:</label>
                    <input type="text" id="subject" placeholder="e.g., JavaScript, DevOps" required>
                </div>
                <div class="form-group">
                    <label for="hours">Hours Studied:</label>
                    <input type="number" id="hours" min="0.1" step="0.1" placeholder="e.g., 2.5" required>
                </div>
                <button type="submit">Add Session</button>
            </form>
        </div>

        <div class="card">
            <h2>Total Progress: <span id="total-hours">0</span> Hours</h2>
            <ul id="log-list" class="log-list">
                </ul>
            <button id="clear-btn" class="clear-btn">Clear All Data</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
